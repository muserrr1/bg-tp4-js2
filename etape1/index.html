<!DOCTYPE html>


<html lang="fr">


<head>




    <meta charset="UTF-8">

    <!-- on relie le fichier style.css pour mettre en forme le tableau -->


    <link rel="stylesheet" href="style.css">




       

     </head>
        <body>
    <!-- le tableau est dans un conteneur div avec l'identifiant table_container -->
    <div id="table_container">
 





 <!-- tableau statique : une ligne d'entete (th) puis 3 lignes de donnees (td) -->



 <table>
        <!-- ligne d'entete -->
            <tr>
                <th>N°</th>
        <th>Nom</th>
             <th>Prénom</th>
       <th>Points</th>

                <th>Select</th>
            </tr>
 




            <!-- chaque td porte une classe pour la mise en forme dans style.css -->
            <!-- col_number : N° et Points / col_text : Nom et Prénom / col_chkbox : case a cocher -->
            <tr>
                <td class="col_number">1</td>
                <td class="col_text">Nom1</td>
                <td class="col_text">Prénom1</td>
                <td class="col_number">5</td>
                <td class="col_chkbox"><input type="checkbox"/></td>
            </tr>
            <tr>
                <td class="col_number">2</td>
                <td class="col_text">Nom2</td>
                <td class="col_text">Prénom2</td>
                <td class="col_number">5</td>
                <td class="col_chkbox"><input type="checkbox"/></td>
            </tr>
            <tr>
                <td class="col_number">3</td>
                <td class="col_text">Nom3</td>
                <td class="col_text">Prénom3</td>
                <td class="col_number">5</td>
                <td class="col_chkbox"><input type="checkbox"/></td>
     </tr>
 </table>
 
</div>
</body>
</html>
